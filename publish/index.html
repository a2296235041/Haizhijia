<html>

        <title>ウミノイエ</title>
        <style>
            /* ========== 新增：手机端竖屏提醒弹窗 ========== */
            .orientation-tip-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, rgba(255, 107, 107, 0.85) 0%, rgba(255, 159, 67, 0.85) 100%);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 99999999;
                opacity: 0;
                visibility: hidden;
                transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                will-change: opacity, visibility;
                touch-action: none;
            }

            .orientation-tip-modal.show {
                opacity: 1;
                visibility: visible;
            }

            .orientation-tip-content {
                background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 248, 240, 0.9) 100%);
                border-radius: 24px;
                padding: 35px 25px;
                text-align: center;
                font-family: 'Microsoft YaHei', sans-serif !important;
                max-width: 360px;
                width: 90%;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                transform: translateY(-30px) scale(0.9);
                transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                will-change: transform;
                position: relative;
                overflow: hidden;
                touch-action: manipulation;
            }

            .orientation-tip-modal.show .orientation-tip-content {
                transform: translateY(0) scale(1);
            }

            /* 装饰元素 */
            .orientation-tip-content::before {
                content: '';
                position: absolute;
                top: -40px;
                right: -40px;
                width: 120px;
                height: 120px;
                background: linear-gradient(135deg, rgba(255, 107, 107, 0.2) 0%, rgba(255, 159, 67, 0.2) 100%);
                border-radius: 50%;
                z-index: 0;
            }

            .orientation-tip-content::after {
                content: '';
                position: absolute;
                bottom: -25px;
                left: -25px;
                width: 80px;
                height: 80px;
                background: linear-gradient(135deg, rgba(255, 107, 107, 0.15) 0%, rgba(255, 159, 67, 0.15) 100%);
                border-radius: 50%;
                z-index: 0;
            }

            .orientation-tip-title {
                font-size: 22px;
                font-weight: 700;
                color: #ff6b6b;
                margin-bottom: 16px;
                position: relative;
                z-index: 1;
            }

            .orientation-tip-text {
                font-size: 15px;
                color: #555555;
                margin-bottom: 24px;
                line-height: 1.6;
                position: relative;
                z-index: 1;
            }

            .orientation-tip-buttons {
                display: flex;
                justify-content: center;
                position: relative;
                z-index: 1;
            }

            .orientation-tip-btn {
                padding: 12px 32px;
                border: none;
                border-radius: 25px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                font-family: inherit;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                touch-action: manipulation;
                min-height: 48px;
                min-width: 120px;
            }

            .orientation-btn-ok {
                background: linear-gradient(135deg, #ff6b6b 0%, #ffa07a 100%);
                color: #ffffff;
            }

            .orientation-btn-ok:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            }

            /* 旋转提示图标 */
            .rotate-icon {
                width: 60px;
                height: 60px;
                margin: 0 auto 16px;
                position: relative;
                z-index: 1;
            }

            .rotate-icon svg {
                width: 100%;
                height: 100%;
                fill: #ff6b6b;
                animation: rotateHint 2s infinite ease-in-out;
            }

            @keyframes rotateHint {
                0%, 100% { transform: rotate(0deg); }
                50% { transform: rotate(90deg); }
            }

            /* 关键修复：弹窗显示时禁用Canvas的事件 */
/* 移动端适配 */
            @media (max-width: 768px) {
                .orientation-tip-content {
                    padding: 30px 20px;
                    max-width: 300px;
                    border-radius: 20px;
                }

                .orientation-tip-title {
                    font-size: 20px;
                }

                .orientation-tip-text {
                    font-size: 14px;
                }

                .rotate-icon {
                    width: 50px;
                    height: 50px;
                }
            }

            /* 平板适配 */
            @media (min-width: 769px) and (max-width: 1024px) {
                .orientation-tip-content {
                    padding: 35px 25px;
                    max-width: 360px;
                }

                .orientation-tip-title {
                    font-size: 22px;
                }

                .orientation-tip-text {
                    font-size: 15px;
                }
            }

            /* 字体加载优化 */
            @font-face {
                font-family: 'Microsoft YaHei';
                src: local('Microsoft YaHei'), local('微软雅黑');
                font-display: swap; /* 关键：字体加载前显示系统默认字体 */
            }
        </style>
        <style id="umi-pack-style">
            #umi-pack-loading{
              position:fixed;inset:0;z-index:999999;background:#000;
              display:flex;align-items:center;justify-content:center;
              font-family:"Yu Gothic","Hiragino Sans","Microsoft YaHei",sans-serif;
              color:#f2f2f2;
            }
            #umi-pack-box{
              width:min(400px,86vw);text-align:left;
              border:2px solid #c9a0ff;padding:22px 24px 20px;
              box-shadow:6px 6px 0 rgba(191,90,242,.45);
              background:linear-gradient(160deg,#120816 0%,#1a0b24 55%,#0d1520 100%);
            }
            #umi-pack-phase{
              font-size:12px;font-weight:700;letter-spacing:.18em;
              color:#b79aff;margin-bottom:10px;
            }
            #umi-pack-msg{
              font-size:15px;font-weight:700;letter-spacing:.03em;
              margin-bottom:14px;min-height:1.4em;color:#fff;

            #umi-pack-bar{
              height:12px;background:#000;border:2px solid rgba(201,160,255,.7);overflow:hidden;
            }
            #umi-pack-fill{
              height:100%;width:0%;background:linear-gradient(90deg,#bf5af2,#7ad7ff);
              transition:width .12s linear;
            }
            #umi-pack-pct{
              margin-top:10px;font-size:12px;color:rgba(245,238,252,.7);
              font-variant-numeric:tabular-nums;
            }
        </style>
    </head>
    <body style="background-color: black">
        <div id="umi-pack-loading" aria-live="polite">
            <div id="umi-pack-box">
                <div id="umi-pack-phase">① 下载</div>
                <div id="umi-pack-msg">准备资源包…</div>
                <div id="umi-pack-bar"><div id="umi-pack-fill"></div></div>
                <div id="umi-pack-pct">0%</div>
            </div>
        </div>

        <!-- ========== 新增：手机端竖屏提醒弹窗 ========== -->
        <div id="orientationTipModal" class="orientation-tip-modal">
            <div class="orientation-tip-content">
                <div class="rotate-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                    </svg>
                </div>
                <div class="orientation-tip-title">请旋转您的手机</div>
                <div class="orientation-tip-text">
                    检测到您使用的是移动端，建议您旋转屏幕以获得更大的游戏画面，部分游戏可能不支持移动端游玩。
                </div>
                <div class="orientation-tip-buttons">
                    <button class="orientation-tip-btn orientation-btn-ok" id="orientationTipOkBtn">我知道了</button>
                </div>
            </div>
        </div>

        <script>
            // 所有弹窗逻辑放在最前面，确保在游戏脚本之前执行
            (function() {
                // ========== 精准手机端判断函数（排除平板） ==========
                function isMobileDevice() {
                    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                    
                    // 排除所有平板设备
                    const isTablet = /(ipad|tablet|(android(?!.*mobile))|(windows(?!.*phone)(.*touch))|kindle|playbook|silk|(puffin(?!.*(IP|AP|WP))))/i.test(userAgent);
                    if (isTablet) return false;
                    
                    // 判断手机设备
                    const isMobile = /android|webos|iphone|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
                    
                    // 额外通过屏幕尺寸验证（防止特殊设备误判）
                    const isSmallScreen = window.innerWidth < 768 && window.innerHeight < 1024;
                    
                    return isMobile && isSmallScreen;
                }

                // ========== 横竖屏检测函数 ==========
                function isLandscape() {
                    // 优先使用现代API，兼容性更好
                    if (window.screen && window.screen.orientation) {
                        return window.screen.orientation.type.includes('landscape');
                    }
                    // 降级方案：通过宽高比判断
                    return window.innerWidth > window.innerHeight;
                }

                // ========== 通用事件处理函数 ==========
                function addButtonHandler(button, handler) {
                    let isTouched = false;

                    button.addEventListener('touchend', function(e) {
                        e.preventDefault();
                        e.stopImmediatePropagation(); // 关键：阻止事件被游戏引擎捕获
                        if (!isTouched) {
                            isTouched = true;
                            handler();
                            setTimeout(() => { isTouched = false; }, 300);
                        }
                    }, { passive: false });

                    button.addEventListener('click', function(e) {
                        e.stopImmediatePropagation(); // 关键：阻止事件被游戏引擎捕获
                        if (!isTouched) {
                            handler();
                        }
                    });
                }

                // ========== 元素引用 ==========
                const orientationTipModal = document.getElementById('orientationTipModal');
                const orientationTipOkBtn = document.getElementById('orientationTipOkBtn');

                // 无欢迎弹窗：进页直接检查竖屏提醒
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', function () {
                        setTimeout(showOrientationTipIfNeeded, 100);
                    });
                } else {
                    setTimeout(showOrientationTipIfNeeded, 100);
                }

                // ========== 竖屏提醒逻辑（纯方向驱动） ==========
                function showOrientationTipIfNeeded() {
                    // 只有在手机端且竖屏时显示提醒
                    if (isMobileDevice() && !isLandscape()) {
                        orientationTipModal.classList.add('show');
                    } else {
                        // 横屏或非手机端，确保弹窗关闭
                        orientationTipModal.classList.remove('show');
                    }
                }

                // ========== 实时监听屏幕方向变化 ==========
                function handleOrientationChange() {
                    // 如果欢迎弹窗还在显示，不处理
// 根据当前方向自动显示/隐藏提醒
                    showOrientationTipIfNeeded();
                }

                // 绑定屏幕方向变化事件（兼容所有浏览器）
                if (window.screen && window.screen.orientation) {
                    window.screen.orientation.addEventListener('change', handleOrientationChange);
                } else {
                    // 降级方案：使用resize事件
                    window.addEventListener('resize', handleOrientationChange);
                }

                // 竖屏提醒"我知道了"按钮
                addButtonHandler(orientationTipOkBtn, function() {
                    orientationTipModal.classList.remove('show');
                    // 不设置任何永久关闭标记，下次竖屏会再次显示
                });

                // 点击遮罩层关闭竖屏提醒
                orientationTipModal.addEventListener('click', function(e) {
                    if (e.target === orientationTipModal) {
                        orientationTipModal.classList.remove('show');
                    }
                });

                // 按ESC键关闭竖屏提醒
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && orientationTipModal.classList.contains('show')) {
                        orientationTipModal.classList.remove('show');
                    }
                });
            })();
        </script>

        <script
          type="text/javascript"
          src="asset-cdn.js"
          onerror="window.__UMI_EARLY_ERROR__ = '资源引导脚本加载失败'"
        ></script>
        <script>
        (function () {
          window.__UMI_RELEASE__ = "umi260908m";
          // 主引擎由 HTML 静态加载；首个可交互场景出现后才移除遮罩。
          var overlay = document.getElementById("umi-pack-loading");
          var fill = document.getElementById("umi-pack-fill");
          var msg = document.getElementById("umi-pack-msg");
          var phaseEl = document.getElementById("umi-pack-phase");
          var pctEl = document.getElementById("umi-pack-pct");
          var PHASE = {
            download: "① 下载资源包",
            unzip: "② 解压资源",
            boot: "③ 启动引擎",
            done: "完成",
            error: "出错"
          };
          var hidden = false;
          var bootTimer = null;
          var bootWatchStartedAt = 0;

          function setUi(info) {
            if (!info || hidden) return;
            var ratio = Math.max(0, Math.min(1, Number(info.ratio) || 0));
            if (fill) fill.style.width = (ratio * 100).toFixed(1) + "%";
            if (msg) msg.textContent = info.message || "";
            if (phaseEl) phaseEl.textContent = PHASE[info.phase] || info.phase || "";
            if (pctEl) {
              var detail = "";
              if (info.phase === "download" && info.total > 0) {
                detail = (info.current / 1048576).toFixed(1) + " / " + (info.total / 1048576).toFixed(1) + " MB · ";
              } else if (info.phase === "unzip" && info.total > 0) {
                detail = info.current + " / " + info.total + " · ";
              }
              pctEl.textContent = detail + Math.round(ratio * 100) + "%";
            }
          }

          if (window.__UMI_CDN && typeof __UMI_CDN.onProgress === "function") {
            __UMI_CDN.onProgress(setUi);
          }

          function hideOverlay() {
            if (hidden) return;
            hidden = true;
            if (bootTimer) {
              clearInterval(bootTimer);
              bootTimer = null;
            }
            if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
            try {
              if (window.dzmm && dzmm.loading && typeof dzmm.loading.ready === "function") {
                dzmm.loading.ready();
              }
            } catch (e) {}
          }

          function showBootError(message) {
            if (hidden) return;
            if (bootTimer) {
              clearInterval(bootTimer);
              bootTimer = null;
            }
            setUi({ phase: "error", message: message || "游戏启动失败，请刷新重试", ratio: 1 });
            if (overlay) overlay.style.background = "#170909";
            try {
              if (window.dzmm && dzmm.loading && typeof dzmm.loading.error === "function") {
                dzmm.loading.error("GAME_BOOT_FAILED", message || "Game boot failed");
              }
            } catch (e) {}
          }

          function sceneName(s) {
            try {
              return (s && s.constructor && s.constructor.name) || "";
            } catch (e) {
              return "";
            }
          }

          function isBootLike(s) {
            var n = sceneName(s);
            if (n === "Scene_Boot" || n === "Scene_Splash") return true;
            try {
              if (typeof Scene_Boot !== "undefined" && s instanceof Scene_Boot) return true;
            } catch (e) {}
            return false;
          }

          function tryHookSceneStart() {
            if (typeof Scene_Base === "undefined") return false;
            if (Scene_Base.prototype.__umiPackHooked) return true;
            Scene_Base.prototype.__umiPackHooked = true;
            var _start = Scene_Base.prototype.start;
            Scene_Base.prototype.start = function () {
              _start.apply(this, arguments);
              if (!isBootLike(this)) hideOverlay();
            };
            if (typeof Scene_Boot !== "undefined" && Scene_Boot.prototype.terminate) {
              var _terminate = Scene_Boot.prototype.terminate;
              Scene_Boot.prototype.terminate = function () {
                _terminate.apply(this, arguments);
                setTimeout(hideOverlay, 0);
              };
            }
            return true;
          }

          function watchBoot() {
            if (bootWatchStartedAt) return;
            bootWatchStartedAt = Date.now();
            function tick() {
              tryHookSceneStart();
              try {
                var s = window.SceneManager && SceneManager._scene;
                if (s && !isBootLike(s)) {
                  hideOverlay();
                  return;
                }
              } catch (e) {}
              if (Date.now() - bootWatchStartedAt > 60000) {
                showBootError("游戏启动超时，请刷新重试");
                return;
              }
              setTimeout(tick, 50);
            }
            tick();
          }

          function startBootPulse() {
            if (bootTimer || hidden) return;
            setUi({ phase: "boot", message: "正在启动游戏引擎…", ratio: 1 });
            var dots = 0;
            bootTimer = setInterval(function () {
              dots = (dots + 1) % 4;
              setUi({
                phase: "boot",
                message: "正在启动游戏引擎" + "...".slice(0, dots),
                ratio: 1
              });
            }, 400);
          }

          window.__UMI_BOOT_ERROR__ = showBootError;
          if (window.__UMI_EARLY_ERROR__) {
            showBootError(window.__UMI_EARLY_ERROR__ + "，请刷新重试");
          }
          window.__UMI_MAIN_LOADED__ = function () {
            var ready = window.__UMI_CDN && window.__UMI_CDN.ready;
            if (!ready || typeof ready.then !== "function") {
              startBootPulse();
              watchBoot();
              return;
            }
            ready.then(function (packLoaded) {
              var packRequired =
                window.__UMI_CDN &&
                __UMI_CDN.enabled &&
                __UMI_CDN.packMode !== "off";
              if (packRequired && !packLoaded) {
                showBootError("资源包加载失败，请检查网络后刷新重试");
                return;
              }
              startBootPulse();
              watchBoot();
            }, function (error) {
              console.error(
                "[umi] pack readiness failed",
                error && error.message ? error.message : String(error)
              );
              showBootError("资源包加载失败，请检查网络后刷新重试");
            });
          };
        })();
        </script>
        <script
          type="text/javascript"
          src="js/main.js"
          onload="window.__UMI_MAIN_LOADED__()"
          onerror="window.__UMI_BOOT_ERROR__('启动脚本加载失败，请刷新重试')"
        ></script>
